# Clash Party 覆写。可用 raw 链接导入，再在本地改占位符。不要再更新这份覆写。
# 改完后在内核设置里点旋转按钮重启服务。
# 默认先经 Dialer-Res 再连住宅端口。出口 IP 仍是这条住宅代理。
# 默认收台湾、日本、新加坡、美国、韩国，不含香港。
# 节点名里没有这些地区时，改 filter，并把 empty-fallback 写成一个真实节点名，不要写 DIRECT。
# 回滚（中转入口全灭，并且接受 TLS 被掐）：删掉 proxy-groups 这段，dialer-proxy 改成 DIRECT。

proxies+:
  - name: SG_Residential
    type: http
    server: "<HOST>"
    port: 0
    username: "<USERNAME>"
    password: "<PASSWORD>"
    dialer-proxy: Dialer-Res
    # dialer-proxy: DIRECT

proxy-groups+:
  - name: Dialer-Res
    type: url-test
    hidden: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: false
    include-all: true
    filter: '(?i)(台湾|台灣|日本|新加坡|美国|美國|韩国|韓國|\b(TW|JP|SG|US|KR)\b)'
    exclude-filter: '(?i)倍率|IPv6|到期|剩余|官网|失联|故障|香港|\bHK\b'
    empty-fallback: "<一个真实节点名>"

+rules:
  - DOMAIN-SUFFIX,claude.ai,SG_Residential
  - DOMAIN-SUFFIX,claude.com,SG_Residential
  - DOMAIN-SUFFIX,clau.de,SG_Residential
  - DOMAIN-SUFFIX,anthropic.com,SG_Residential
  - DOMAIN-SUFFIX,claudeusercontent.com,SG_Residential
  - DOMAIN-SUFFIX,modelcontextprotocol.io,SG_Residential
  - IP-CIDR,160.79.104.0/21,SG_Residential,no-resolve
  - IP-CIDR6,2607:6bc0::/48,SG_Residential,no-resolve
  - IP-ASN,399358,SG_Residential,no-resolve

  - DOMAIN-SUFFIX,google.com,SG_Residential
  - DOMAIN-SUFFIX,googleapis.com,SG_Residential
  - DOMAIN-SUFFIX,gstatic.com,SG_Residential
  - DOMAIN-SUFFIX,gmail.com,SG_Residential
  - DOMAIN-SUFFIX,googleusercontent.com,SG_Residential
  - DOMAIN-SUFFIX,recaptcha.net,SG_Residential

  - DOMAIN-SUFFIX,withpersona.com,SG_Residential

  - DOMAIN-SUFFIX,webshare.io,SG_Residential
